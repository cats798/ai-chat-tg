name = "ai-chat-tg"
compatibility_date = "2024-11-15"
main = "worker-tg.js"

# 🚀 一键部署：
# https://deploy.workers.cloudflare.com/?url=https://github.com/YOUR_GITHUB/ai-chat-tg
#
# 部署时系统会自动提示：
#   1. 输入 Telegram Bot Token（必填）
#   2. 自动创建 KV Namespace（代码已配置，无需手动操作）
#   3. 自动设置 Webhook

# KV 绑定 —— 部署时自动创建
[kv]
[[kv]]
binding = "AI_CHAT_KV"

# 环境变量 —— 部署时提示输入
[env]
[env.vars]
# TELEGRAM_TOKEN 会在部署时交互式提示输入