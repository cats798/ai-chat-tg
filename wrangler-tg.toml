name = "ai-chat-tg"
compatibility_date = "2024-11-15"

# 先在 Cloudflare Dashboard 创建 KV Namespace:
# Workers → KV → 创建名为 AI_CHAT_KV 的 namespace
# 然后把下面的 id 替换为实际的 namespace id

[kv]
[[kv]]
binding = "AI_CHAT_KV"
id = "REPLACE_WITH_KV_ID"

# 在 Environment Variables 中设置:
# TELEGRAM_TOKEN = "你的 Telegram Bot Token"
# 或者用 wrangler secret: wrangler secret put TELEGRAM_TOKEN

# 部署命令: wrangler deploy